name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift:
    name: Swift package
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify public-source boundary
        run: ./scripts/check-public-boundary.sh

      - name: Run Swift tests
        run: swift test

  android:
    name: Android libraries
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36"

      - name: Run Android tests and lint
        working-directory: android
        run: ./gradlew test lint
